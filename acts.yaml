# The acts jog-mcp keeps the full text of, and what is known about each.
#
# Read by both halves of the project:
#   * jog-mcp-fetch   downloads each `doc_id` from legislatie.just.ro into acts/
#   * jog-mcp         serves acts/; `title` is a friendly (Hungarian) name that
#                     search also matches, and the repeal fields put a warning
#                     on every result from a repealed act or article.
#
# Fields:
#   id                 file name in acts/ (without .md)
#   doc_id             the Portal Legislativ document to fetch; each new
#                      consolidation gets a NEW id, see `alt_ids`
#   alt_ids            other ids of the same act; `jog-mcp-fetch --check --deep`
#                      compares them so a newer consolidation shows up
#   title              friendly name, searched alongside the official title
#   articles           keep only this article range (e.g. a part of a code)
#   repealed_on / repealed_by / superseded_by
#                      the act is no longer in force; kept for files opened
#                      before the repeal, flagged on every result
#   repealed_articles  a PARTIAL repeal: only these article ranges fell
#   min_articles       below this, `--check` suspects the wrong document
#   max_bytes/timeout  the largest documents need more than the defaults
#   note               a short factual note, shown by list_acts
